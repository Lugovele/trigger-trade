name: Deploy TriggerTrade Production

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy Central US candidate apps after building and pushing the image
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: triggertrade-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy TriggerTrade
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: triggertradeacr-dcfmhtd6fmaubtac.azurecr.io
      ACR_REPOSITORY: triggertrade-web
      RESOURCE_GROUP: triggertrade-rg
      WEB_APP: triggertrade-web-centralus
      TRADING_WORKER_APP: triggertrade-worker-uae
      SCHEDULER_APP: triggertrade-scheduler-centralus
      USER_ASSIGNED_IDENTITY: triggertrade-pull-id
      COMMON_ENV_VARS: >-
        TRIGGERTRADE_RUNTIME_MODE=production
        TRIGGERTRADE_TRADING_MODE=paper
        TRIGGERTRADE_LIVE_TRADING_ENABLED=false
        TRIGGERTRADE_EXECUTION_VENUE=bybit_demo_futures
        TRIGGERTRADE_ACTIVE_EXECUTION_VENUE=bybit_demo_futures
        TRIGGERTRADE_TEST_EXECUTION_VENUE=local_test_simulation
        TRIGGERTRADE_EXCHANGE=bybit
        TRIGGERTRADE_MARKET=linear
        TRIGGERTRADE_CATEGORY=linear
        TRIGGERTRADE_BYBIT_ENV=demo
        BYBIT_BASE_URL=https://api-demo.bybit.com
        TRIGGERTRADE_POSTGRES_DSN=secretref:postgres-dsn
        TRIGGERTRADE_POSTGRES_SCHEMA=public
        TRIGGERTRADE_RESEARCH_DEMO_HANDOFF_ENABLED=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name triggertradeacr

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building ${IMAGE}"

          docker build \
            --tag "${IMAGE}" \
            .

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing ${IMAGE}"
          docker push "${IMAGE}"

      - name: Record cloud image digest
        shell: bash
        run: |
          set -euo pipefail

          DIGEST="$(az acr manifest show-metadata \
            --registry triggertradeacr \
            --name "${ACR_REPOSITORY}:${IMAGE_TAG}" \
            --query digest \
            -o tsv)"
          DIGEST_LINE_COUNT="$(printf '%s\n' "$DIGEST" | wc -l | tr -d ' ')"

          if [[ -z "$DIGEST" || "$DIGEST_LINE_COUNT" != "1" || "$DIGEST" != sha256:* ]]; then
            echo "Unable to resolve pushed image digest for $IMAGE" >&2
            exit 1
          fi

          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "Cloud image digest: ${DIGEST}"

      - name: Build-only candidate complete
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Build-only mode complete for ${IMAGE}@${IMAGE_DIGEST}; Container Apps were not modified."

      - name: Resolve managed identity
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          UAMI_ID="$(az identity show \
            --name "$USER_ASSIGNED_IDENTITY" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            -o tsv)"

          if [[ -z "$UAMI_ID" ]]; then
            echo "Unable to resolve managed identity $USER_ASSIGNED_IDENTITY" >&2
            exit 1
          fi

          echo "UAMI_ID=${UAMI_ID}" >> "$GITHUB_ENV"

      - name: Attach managed identities
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for APP in "$WEB_APP" "$TRADING_WORKER_APP" "$SCHEDULER_APP"; do
            az containerapp identity assign \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --user-assigned "$UAMI_ID" \
              --only-show-errors \
              -o none
          done

      - name: Deploy web
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$WEB_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 2 \
            --max-replicas 4 \
            --set-env-vars $COMMON_ENV_VARS TRIGGERTRADE_PROCESS_ROLE=web

      - name: Deploy trading worker
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$TRADING_WORKER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars $COMMON_ENV_VARS TRIGGERTRADE_PROCESS_ROLE=trading-worker TRIGGERTRADE_WORKER_ID=uae-trading-worker-1 BYBIT_API_KEY=secretref:bybit-api-key BYBIT_API_SECRET=secretref:bybit-api-secret

      - name: Deploy scheduler
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$SCHEDULER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars $COMMON_ENV_VARS TRIGGERTRADE_PROCESS_ROLE=scheduler

      - name: Verify deployed images
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          verify_image() {
            local label="$1"
            local app="$2"

            echo "=== ${label} ==="
            local actual_image
            actual_image="$(az containerapp show \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" \
              -o tsv)"

            echo "$actual_image"
            if [[ "$actual_image" != "$IMAGE" ]]; then
              echo "$app is running $actual_image, expected $IMAGE" >&2
              exit 1
            fi
          }

          verify_image "WEB" "$WEB_APP"
          verify_image "TRADING WORKER" "$TRADING_WORKER_APP"
          verify_image "SCHEDULER" "$SCHEDULER_APP"

      - name: Azure logout
        if: always()
        run: az logout || true
